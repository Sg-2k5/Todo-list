<!doctype html>
<html>
  <head>
    <!-- To do app title -->
    <title>Todo-app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- To do app title and icon -->
    <header class="topbar">
      <div class="logo-area">
        <img
          src="https://www.svgrepo.com/show/422566/business-management-todolist.svg"
          alt="todo-icon"
          width="40px"
          height="40px"
        />
      </div>
      <div class="heading">
        <h1>Todo List</h1>
      </div>
    </header>
    <div class="add-task-input">
      <!--adding task container-->
      <input
        type="text"
        id="add-task-text"
        placeholder="Enter a task"
      /><!--Input field-->
      <button type="button" id="add-task-btn">Add task</button
      ><!--add task button-->
    </div>
    <div class="category">
      <!--parent container for the buttons(all,pending,completed)-->
      <button class="category-all" type="button">All</button>
      <button class="category-pending active" type="button">pending</button>
      <button class="category-completed" type="button">completed</button>
    </div>
    <div class="task-list"></div>
    <!--task details-->
    <script src="script.js"></script>
    <!--connection to js file-->
  </body>
</html>
